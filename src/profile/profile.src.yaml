# tempdes profile __NAME__: the options of a run, written by `tempdes profile init`.
#   tempdes run --profile __NAME__        (also sweep and ui)
# Options given on the command line apply on top: lists grow, and single values replace these.
#
# Keep it private. The profile store (`tempdes profile dir`) is outside any repository, and
# its folders are readable only by you. Paths here are relative to this folder, except
# scenario_dir. Commented-out settings show an example: uncomment to use them.
#
# With --profile __NAME__, what tempdes fetches and imports goes into this folder:
#   metrics/    tempdes metrics fetch: the observed metrics (observed.yaml, baseline.yaml)
#   workload/   tempdes workload fetch and import: the histories (histories/), and the
#               workflows inferred from them (workflows.yaml)

description: __DESCRIPTION__   # shown by `tempdes profile list`

scenario: scenario.yaml               # the cluster and its workload

# Where the scenario's own relative paths resolve: its helm_values, dynamic_config_files and
# calibration.observations. This folder, so that they stay in the profile.
scenario_dir: __PROFILE_DIR__

# Observed metrics, to calibrate against and to validate the run with, as
# `tempdes metrics fetch --profile __NAME__ ...` writes them.
#{off
observed:
  - metrics/observed.yaml
#}off

# What-ifs over the scenario, as on the command line: replicas (-r) and dynamic config (-d).
# A constraint in brackets scopes a value, as in Temporal's dynamic config.
#{off
replicas:
  - history=6
dc:
  - history.shardIOConcurrency=2
  - frontend.namespaceRPS[namespace=orders]=4800
#}off

#{off
load: 1.5                             # multiply every start and signal rate, calibrated ones too
client_lb: round_robin                # pinned, round_robin or proxy, over the scenario's
duration: 300                         # seconds measured, over the scenario's duration
warmup: 60                            # seconds of warm-up, over the scenario's
seed: 7                               # over the scenario's seed
#}off
