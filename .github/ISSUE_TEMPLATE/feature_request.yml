name: Feature request
description: Suggest a capability, an output, or a Temporal mechanism to model
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: The question about your cluster that tempdes can't answer today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like tempdes to help. For example, a new hotspot rule, a new input, or a mechanism to simulate.
  - type: textarea
    id: references
    attributes:
      label: Temporal references
      description: Relevant Temporal source, docs, metrics or dynamic config keys.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
